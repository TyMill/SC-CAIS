name: SC-CAIS revision validation

on:
  push:
    branches:
      - 'revision/**'
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff formatting
        run: python -m ruff format --check src tests
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Revision quick smoke campaign
        run: |
          python -c "from sc_cais.revision_experiments import run_campaign; from sc_cais.scenarios import Scenario; s,a=run_campaign(seeds=(0,),horizon=3,scenarios=[Scenario('normal',(), 'baseline','none')],output_dir='outputs/revision_smoke'); print(len(s),len(a)); assert len(s)==12"
      - name: Archive smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-smoke-results
          path: outputs/revision_smoke/
