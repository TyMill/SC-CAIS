name: SC-CAIS revision validation

on:
  push:
    branches:
      - 'revision/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e '.[dev]'
      - name: Normalize formatting
        run: python -m ruff format src tests
      - name: Commit formatting to revision branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: normalize revision Python formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff formatting
        run: python -m ruff format --check src tests
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Revision quick smoke campaign
        run: |
          python -c "from sc_cais.revision_experiments import run_campaign; from sc_cais.scenarios import Scenario; s,a=run_campaign(seeds=(0,),horizon=3,scenarios=[Scenario('normal',(), 'baseline','none')],output_dir='outputs/revision_smoke'); print(len(s),len(a)); assert len(s)==12"
      - name: Missing-control campaign quick verification
        run: python examples/revision_missing_controls.py --quick --output outputs/revision_missing_smoke
      - name: Latency protocol quick verification
        run: python examples/revision_latency_campaign.py --quick --output outputs/revision_latency_smoke
      - name: Archive smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-smoke-results
          path: |
            outputs/revision_smoke/
            outputs/revision_missing_smoke/
            outputs/revision_latency_smoke/
