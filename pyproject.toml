[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-cais"
version = "0.3.2"
description = "Controlled Agentic AI runtime assurance and cyber-physical benchmark for resilient supply chains."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "SC-CAIS contributors"}]
keywords = ["agentic-ai", "supply-chain", "runtime-assurance", "resilience", "cyber-physical"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "scipy>=1.14",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
sc-cais = "sc_cais.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["sc_cais"]

[[tool.mypy.overrides]]
module = ["networkx", "scipy", "scipy.*", "yaml"]
ignore_missing_imports = true
